version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8001 --workers 4
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - DEBUG=False
      - MONGO_URI=mongodb://mongodb:27017
      - MONGO_DB_NAME=gst_reconciliation
      # Use localhost or override via environment if connecting to Neo4j
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
      - API_KEY=${API_KEY}
    restart: always
    depends_on:
      - mongodb

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    command: streamlit run frontend/dashboard.py --server.port 8502 --server.address 0.0.0.0
    ports:
      - "8502:8502"
    environment:
      - BACKEND_URL=http://backend:8001
      - API_KEY=${API_KEY}
    restart: always
    depends_on:
      - backend

  mongodb:
    image: mongo:6.0
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: always

volumes:
  mongo_data:
